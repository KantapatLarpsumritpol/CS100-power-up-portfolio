<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS100 Power up Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-briefcase-fill me-2"></i>CS100 Portfolios</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="portfolio-nav-links">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">

        <div class="card p-4 p-md-5 shadow-sm border-0"
            style="border-radius: 20px; background: rgba(255, 255, 255, 0.95);">

            <div class="text-center mb-4">
                <h2 class="mb-2 fw-bold">My Portfolios</h2>
                <p class="text-muted">เลือกแฟ้มสะสมผลงานของคุณ หรือคลิกเครื่องหมาย + เพื่อสร้าง Portfolio ใหม่</p>
            </div>

            <div id="portfolio-container" class="row g-4 justify-content-center">

                <!-- โค้ดใหม่ที่ใส่ลูกเล่นเพิ่มเข้าไป -->
                <div class="col-md-4 col-sm-6">
                    <div class="card h-100 p-4 text-center d-flex align-items-center justify-content-center shadow-sm border-0"
                        id="btn-create-portfolio" data-bs-toggle="modal" data-bs-target="#createPortfolioModal"
                        style="cursor: pointer; min-height: 220px; border-radius: 16px; transition: all 0.3s ease;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <div class="rounded-circle d-flex align-items-center justify-content-center mb-3 shadow-sm"
                                style="width: 65px; height: 65px; background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #4f46e5; font-size: 2rem;">
                                <i class="bi bi-plus-lg"></i>
                            </div>
                            <h5 class="card-title fw-bold" style="color: #4f46e5;">Create New Portfolio</h5>
                        </div>
                    </div>
                </div>
            </div>
            <div id="portfolio-list"></div> <!--เพิ่มพื้นที่สำหรับ card-->
        </div>

    </div>

    <div class="modal fade" id="createPortfolioModal" tabindex="-1" aria-labelledby="createPortfolioModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="createPortfolioModalLabel">Create New Portfolio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="create-portfolio-form">

                        <div class="mb-3">
                            <label for="portfolio-name" class="form-label fw-semibold">Display Name (ชื่อจริง
                                หรือชื่อสมมติ)</label>
                            <input type="text" class="form-control" id="portfolio-name" name="displayName" required
                                placeholder="เช่น John Doe">
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-enjoy" class="form-label fw-semibold">What I Enjoy (ชอบทำอะไร)</label>
                            <textarea class="form-control" id="portfolio-enjoy" name="whatEnjoy" rows="2" required
                                placeholder="เช่น Coding, Playing Games, Photography"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-tried" class="form-label fw-semibold">What I’ve Tried
                                (ลองทำอะไรมาแล้วบ้าง)</label>
                            <textarea class="form-control" id="portfolio-tried" name="whatTried" rows="2" required
                                placeholder="เช่น Built Web Portfolio with Bootstrap, Basic AI Training"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-curious" class="form-label fw-semibold">What I’m Curious About
                                (สนใจหรืออยากรู้อะไรเพิ่ม)</label>
                            <textarea class="form-control" id="portfolio-curious" name="whatCurious" rows="2" required
                                placeholder="เช่น Game Development, Advanced Cloud Systems"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"
                            style="border-radius: 10px;">Save & Create Portfolio</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
