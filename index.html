<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS100 Power up Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container my-5">

        <div class="card p-4 p-md-5 shadow-sm border-0" style="border-radius: 20px; background: rgba(255, 255, 255, 0.95);">
            
            <!-- ส่วนหัวข้อและคำอธิบาย -->
            <div class="text-center mb-4">
                <h2 class="mb-2 fw-bold">My Portfolios</h2>
                <p class="text-muted">เลือกแฟ้มสะสมผลงานของคุณ หรือคลิกเครื่องหมาย + เพื่อสร้าง Portfolio ใหม่</p>
            </div>

            <div id="portfolio-container" class="row g-4 justify-content-center">
                
                <!-- การ์ดปุ่มเครื่องหมาย + สำหรับสร้าง Portfolio ใหม่ -->
                <div class="col-md-4 col-sm-6">
                    <div class="card h-100 shadow-sm text-center p-4 d-flex align-items-center justify-content-center" 
                         id="btn-create-portfolio" 
                         style="cursor: pointer; border: 2px dashed #a5b4fc; background-color: #faf5ff; min-height: 220px; transition: all 0.3s ease;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <div class="rounded-circle d-flex align-items-center justify-content-center mb-3" 
                                 style="width: 65px; height: 65px; background-color: #e0e7ff; color: #4f46e5; font-size: 2rem;">
                                <i class="bi bi-plus-lg"></i>
                            </div>
                            <h5 class="card-title fw-bold" style="color: #4f46e5;">Create New Portfolio</h5>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
