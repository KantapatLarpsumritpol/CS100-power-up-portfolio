<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS100 Power up Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-briefcase-fill me-2"></i>CS100 Portfolios</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="portfolio-nav-links">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="home=view" class="container my-5"> <!--add id-->

        <div class="card p-4 p-md-5 shadow-sm border-0"
            style="border-radius: 20px; background: rgba(255, 255, 255, 0.95);">

            <div class="text-center mb-4">
                <h2 class="mb-2 fw-bold">My Portfolios</h2>
                <p class="text-muted">เลือกแฟ้มสะสมผลงานของคุณ หรือคลิกเครื่องหมาย + เพื่อสร้าง Portfolio ใหม่</p>
            </div>

            <div id="portfolio-container" class="row g-4 justify-content-center">

                <!-- โค้ดใหม่ที่ใส่ลูกเล่นเพิ่มเข้าไป -->
                <div class="col-md-4 col-sm-6">
                    <div class="card h-100 p-4 text-center d-flex align-items-center justify-content-center shadow-sm border-0"
                        id="btn-create-portfolio" data-bs-toggle="modal" data-bs-target="#createPortfolioModal"
                        style="cursor: pointer; min-height: 220px; border-radius: 16px; transition: all 0.3s ease;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <div class="rounded-circle d-flex align-items-center justify-content-center mb-3 shadow-sm"
                                style="width: 65px; height: 65px; background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #4f46e5; font-size: 2rem;">
                                <i class="bi bi-plus-lg"></i>
                            </div>
                            <h5 class="card-title fw-bold" style="color: #4f46e5;">Create New Portfolio</h5>
                        </div>
                    </div>
                </div>
            </div>
           
            <div id="portfolio-list"></div> <!--เพิ่มพื้นที่สำหรับ card-->

        </div>
    </div>

    <div id="detail-view" class="container my-5" hidden>

        <div id="card-container" class="row g-3"></div>
        
        <button id="btn-add-item" class="btn btn-primary mt-3"> + add item</button>

        <div id="form-container" class="mt-4" hidden>

                <form id="item-form" class="card p-4 p-md-5 shadow-sm border-0 rounded-4 bg-white">
            
            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Title (ชื่อผลงาน)</label>
                <input type="text" class="form-control" id="title" name="title" required placeholder="ระบุชื่อผลงานหรือโปรเจกต์">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="type" class="form-label fw-semibold">Type (ประเภทผลงาน)</label>
                    <input type="text" class="form-control" id="type" name="type" required placeholder="เช่น Web Application, Assignment">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label fw-semibold">Date (วันที่ดำเนินการ)</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="role" class="form-label fw-semibold">Role (บทบาทหน้าที่)</label>
                    <input type="text" class="form-control" id="role" name="role" required placeholder="เช่น Frontend Developer, Lead">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="skills" class="form-label fw-semibold">Skills (ทักษะที่ใช้)</label>
                    <input type="text" class="form-control" id="skills" name="skills" required placeholder="เช่น HTML, CSS, JavaScript (คั่นด้วยจุลภาค)">
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description (รายละเอียดผลงาน)</label>
                <textarea class="form-control" id="description" name="description" rows="3" required placeholder="อธิบายภาพรวมและเป้าหมายของผลงาน"></textarea>
            </div>

            <hr class="my-4 text-muted">
            <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-journal-richtext me-2"></i>Reflection (การสะท้อนคิด)</h5>

            <div class="mb-3">
                <label for="whatIDid" class="form-label fw-semibold">What I did (สิ่งที่ได้ทำ)</label>
                <input type="text" class="form-control" id="whatIid" name="whatIDid" required placeholder="งานหรือหน้าที่ที่คุณรับผิดชอบจริง">
            </div>

            <div class="mb-3">
                <label for="whatILearned" class="form-label fw-semibold">What I learned (สิ่งที่ได้เรียนรู้)</label>
                <input type="text" class="form-control" id="whatILearned" name="whatILearned" required placeholder="ความรู้หรือทักษะใหม่ที่ได้รับ">
            </div>

            <div class="mb-3">
                <label for="challenge" class="form-label fw-semibold">Challenge (อุปสรรคที่พบ)</label>
                <input type="text" class="form-control" id="challenge" name="challenge" required placeholder="ปัญหาที่เจอและวิธีรับมือ">
            </div>

            <div class="mb-3">
                <label for="nextStep" class="form-label fw-semibold">Next step (แนวทางต่อยอด)</label>
                <input type="text" class="form-control" id="nextStep" name="nextStep" required placeholder="สิ่งที่จะนำไปพัฒนาต่อในอนาคต">
            </div>

            <div class="mb-4">
                <label for="evidence" class="form-label fw-semibold">Evidence (ลิงก์หลักฐาน / URL)</label>
                <input type="url" class="form-control" id="evidence" name="evidence" required placeholder="https://github.com/your-repo">
            </div>

            <button type="submit" class="btn btn-primary py-3 fw-bold rounded-3 shadow-sm">Submit Item</button>
        </form>

        </div>

    </div>


    <div class="modal fade" id="createPortfolioModal" tabindex="-1" aria-labelledby="createPortfolioModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="createPortfolioModalLabel">Create New Portfolio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="create-portfolio-form">

                        <div class="mb-3">
                            <label for="portfolio-name" class="form-label fw-semibold">Display Name (ชื่อจริง
                                หรือชื่อสมมติ)</label>
                            <input type="text" class="form-control" id="portfolio-name" name="displayName"
                                placeholder="เช่น John Doe">
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-enjoy" class="form-label fw-semibold">What I Enjoy (ชอบทำอะไร)</label>
                            <textarea class="form-control" id="portfolio-enjoy" name="whatEnjoy" rows="2"
                                placeholder="เช่น Coding, Playing Games, Photography"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-tried" class="form-label fw-semibold">What I’ve Tried
                                (ลองทำอะไรมาแล้วบ้าง)</label>
                            <textarea class="form-control" id="portfolio-tried" name="whatTried" rows="2"
                                placeholder="เช่น Built Web Portfolio with Bootstrap, Basic AI Training"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio-curious" class="form-label fw-semibold">What I’m Curious About
                                (สนใจหรืออยากรู้อะไรเพิ่ม)</label>
                            <textarea class="form-control" id="portfolio-curious" name="whatCurious" rows="2"
                                placeholder="เช่น Game Development, Advanced Cloud Systems"></textarea>
                        </div>

                        <p class="form-error mb-2" id="profile-error" role="alert"></p>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"
                            style="border-radius: 10px;">Save & Create Portfolio</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="item.js"></script>
</body>

</html>
